[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exoplanet-hunter-backend"
version = "0.1.0"
description = "Backend for the Exoplanet Hunter research application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "lightkurve>=2.5,<3.0",
    "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
test = [
    "httpx2>=2.0,<3.0",
    "pytest>=8.0,<9.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
